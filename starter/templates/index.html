<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <button id="theme-toggle" type="button" aria-pressed="false">Dark Mode</button>
  <div id="sudoku-board"></div>
  <div class="controls">
    <label for="difficulty">Difficulty</label>
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="new-game">New Game</button>
    <button id="hint">Hint</button>
    <button id="check-solution">Check Solution</button>
    <span class="timer-label">Time: <strong id="timer">00:00</strong></span>
    <span id="message"></span>
  </div>
  <section class="scoreboard" aria-labelledby="scoreboard-title">
    <h2 id="scoreboard-title">Top 10 Scores</h2>
    <ol id="scoreboard-list"></ol>
  </section>
  <form id="completion-form" class="completion-panel" hidden>
    <h2>Puzzle complete!</h2>
    <label for="player-name">Name</label>
    <input id="player-name" name="player-name" type="text" maxlength="40" autocomplete="name">
    <button type="submit">Save Score</button>
  </form>
  <script src="/static/main.js"></script>
</body>
</html>
